name: Item info from poedb

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"   # weekly; only items that are new or older than 30 days are fetched

permissions:
  contents: write
  actions: write

concurrency:
  group: poedb
  cancel-in-progress: false

jobs:
  poedb:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch item pages from poedb.tw
        run: python scripts/poedb.py data/poedb.json
      - name: Commit the cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/poedb.json
          git diff --cached --quiet && exit 0
          git commit -m "Update poedb item info"
          git pull --rebase -q && git push
          gh workflow run refresh.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
