name: Probe Faustus API (temporary)
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe-faustus.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Call web.poecdn.com currency-exchange
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          h = int(time.time()) // 3600 * 3600 - 3600
          for url in ["https://web.poecdn.com/api/currency-exchange", f"https://web.poecdn.com/api/currency-exchange/{h}"]:
              t0 = time.time()
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "poe-market-trends (github.com/Strix-YT/poe-market-trends)"})
                  with urllib.request.urlopen(req, timeout=60) as r:
                      body = r.read(); j = json.loads(body)
                  C, D = "Metadata/Items/Currency/CurrencyRerollRare", "Metadata/Items/Currency/CurrencyModValues"
                  cov = [m for m in j.get("markets", []) if m["league"] == "Covens"]
                  dc = next((m for m in cov if C in m["market_pair"] and D in m["market_pair"]), None)
                  rate = dc and dc["volume_traded"][C] / max(1, dc["volume_traded"][D])
                  print(f"PROBE OK {url} status={r.status} bytes={len(body)} secs={time.time()-t0:.1f} next={j.get('next_change_id')} markets={len(j.get('markets', []))} covens={len(cov)} divine_in_chaos={rate}")
              except Exception as e:
                  print(f"PROBE FAIL {url} {type(e).__name__}: {e}")
          PY
