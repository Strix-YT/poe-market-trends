name: Refresh prices and deploy

on:
  schedule:
    - cron: "41 * * * *"   # hourly, off the top of the hour to avoid queue delays
  workflow_dispatch:        # "Run workflow" button = refresh now
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch poe.ninja and build forecasts
        env:
          LEAGUE: Covens
          PREV_HOURLY_URL: https://strix-yt.github.io/poe-market-trends/data/hourly.json
        run: python scripts/build.py site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
