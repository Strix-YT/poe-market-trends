name: Refresh prices and deploy

on:
  schedule:
    # GitHub often skips or delays scheduled runs on free repos, so ask four times an hour;
    # each run only fetches what's new, and the site refreshes whenever any of them gets through.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:        # "Run workflow" button = refresh now
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Past-league price curves
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: curves
          path: site/data/curves
      - name: Past-league hourly prices
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: pastfx
          path: site/data/pastfx
      - run: rm -rf site/data/curves/.git site/data/pastfx/.git site/data/pastfx/cache
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch poe.ninja and build forecasts
        env:
          LEAGUE: Covens
          LEAGUE_START: "2026-11-14"
          PREV_HOURLY_URL: https://strix-yt.github.io/poe-market-trends/data/hourly.json
          PREV_LEAGUE_URL: https://strix-yt.github.io/poe-market-trends/data/league.json
        run: python scripts/build.py site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
